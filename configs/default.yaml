# Neutral starter team for a fresh IDACC profile.
#
# IDACC resolves the signed-in runtime and its current model during onboarding.
# This template deliberately does not pin a provider, model, wallet, external
# messaging transport, working directory, or privileged administration skill.

version: "1"
team: default

defaults:
  local: true
  skills:
    - brain
    - catalog
    - identity
    - inter-agent
    - task-discipline

agents:
  - name: lead
    lead: true
    description: >-
      Coordinates the active team, aligns work to the operator's goals,
      delegates bounded assignments, reviews returned evidence, and escalates
      privileged or ambiguous decisions.
    skills:
      - team-coordinator
    catalog:
      role: lead
      expertise:
        - coordination
        - task-routing
        - evidence-synthesis
        - goal-alignment
      costTier: high
      status: available

  - name: coder
    description: >-
      Implements focused changes, verifies them in proportion to risk, and
      returns reproducible evidence without expanding the requested scope.
    catalog:
      role: engineer
      expertise:
        - implementation
        - debugging
        - testing
        - code-review
      costTier: high
      status: available

  - name: researcher
    description: >-
      Investigates unfamiliar systems, validates evidence and completeness,
      documents findings, and clearly separates sourced facts from inference.
    catalog:
      role: researcher
      expertise:
        - research
        - evidence-validation
        - documentation
        - risk-analysis
      costTier: medium
      status: available
