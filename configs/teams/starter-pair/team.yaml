# starter-pair — minimal 2-agent team template.
#
# Install via the manager:
#   POST /library/install { from: "team:starter-pair", to: "team:<your-team>" }
# The install endpoint rewrites the top-level `team:` field via YAML AST
# (the `yaml` package's Document API — never regex) and prepends a
# provenance header to the written file.
#
# Inline-only — agents declare their persona via `description:` and do
# not reference a `configs/agents/` library entry. Clone this template
# when you want a clean starting point; use solidity-pair when you
# want a worked example of peer `agent:` and `skills:`.

version: "1"
team: starter-pair

defaults:
  local: true
  runtime: claude-code-cli
  model: claude-opus-4-7
  skills:
    - identity
    - inter-agent
    - catalog
    - task-discipline

agents:
  - name: lead
    description: >-
      Team lead. Receives scoped objectives from default/lead or the operator,
      checks them against the active primary goal first and secondary goals
      second, splits the remaining work into tasks for dev, tracks completion,
      and returns substantial accomplishment packets through default/coder and
      default/researcher validation before default/lead treats the work as
      final. If either validator bounces the work, refines the tasks with dev
      and resubmits a corrected summary.
    model: claude-opus-4-7
    skills:
      - team-coordinator
      - brain

  - name: dev
    description: >-
      Implements assigned tasks against the lead's plan, reports concise
      completion evidence and blockers back to lead, and does not bypass the
      default-team validator return path for substantial work.
