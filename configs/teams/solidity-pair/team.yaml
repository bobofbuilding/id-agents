# solidity-pair — builder + adversarial auditor for smart contracts.
#
# Install via the manager:
#   POST /library/install { from: "team:solidity-pair", to: "team:<your-team>" }
# The install endpoint rewrites the top-level `team:` field via YAML AST
# (the `yaml` package's Document API — never regex) and prepends a
# provenance header to the written file.
#
# Worked example of v3 peer surfaces on agent entries:
#   - `agent:`  selects one entry under configs/agents/<name>/
#   - `skills:` selects zero or more entries under configs/skills/<name>/
# These two are peers — NOT nested. `skills:` here overlays on top of
# the bundled skills shipped with the library agent (deploy is Step A
# entry copy, then Step B skill overlay).

version: "1"
team: solidity-pair

defaults:
  local: true
  runtime: claude-code-cli
  skills:
    - brain
    - identity
    - inter-agent
    - catalog
    - task-discipline

agents:
  - name: builder
    description: >-
      Onchain team lead and day-to-day Foundry/Solidity developer. Receives
      scoped objectives from default/lead or the operator, checks them against
      the active primary goal first and secondary goals second, delegates
      adversarial review to auditor, collects implementation plus audit
      evidence, and returns substantial accomplishment packets through
      default/coder and default/researcher validation before default/lead treats
      the work as final. If either validator bounces the work, refines the
      contract tasks with auditor and resubmits a corrected summary.
    agent: foundry-dev
    # `agent:` and `skills:` are peers on the agent entry.
    skills:
      - identity
      - inter-agent
      - catalog
      - task-discipline
      - team-coordinator
      - brain

  - name: auditor
    description: >-
      Adversarial security reviewer paired with the builder. Reviews assigned
      contract changes, threat models, tests, and deployment assumptions, then
      reports concrete findings and evidence back to builder for the default
      validator return path.
    agent: solidity-security
    skills:
      - identity
      - inter-agent
      - catalog
      - task-discipline
