# research-team — a coordinated research squad: plan → gather → analyze → verify → write.
#
# Install via the manager:
#   POST /library/install { from: "team:research-team", to: "team:<your-team>" }
# or from the control center: HR Manager → Build → "+ From template" → research-team.
#
# Inline-only: each agent declares its persona via `description:` (no
# configs/agents/ library reference). Built-in WebSearch/WebFetch give the
# researchers web access — no special skill required. Runtime defaults to
# `codex` with the account's default model; change the runtime or set per-agent
# runtime/model in the Build flow (or edit this file before installing).

version: "1"
team: research-team

defaults:
  local: true
  runtime: codex
  skills:
    - brain
    - identity
    - inter-agent
    - catalog
    - task-discipline

agents:
  - name: research-lead
    description: >-
      Coordinator. Turns a research question into a plan: breaks it into
      sub-questions, delegates each to the right specialist (web-researcher,
      analyst, fact-checker, writer) via the inter-agent skill, then synthesizes
      their replies into one well-sourced answer. Handles trivial questions
      directly and delegates everything substantial. Returns substantial
      accomplishment packets through default/coder and default/researcher
      validation before default/lead treats the work as final.
    catalog:
      role: >
        Coordinates the research team: decomposes research objectives,
        delegates to analysts/researchers, and synthesizes validated findings
        for default-team validators. Primary liaison for knowledge, sourcing,
        and fact-checking work.
      expertise:
        - orchestration
        - team-coordination
        - research
        - synthesis
        - analysis
        - brain-memory
        - opportunity-tracking
        - bittrees-research
      bittreesLanes:
        - DISCOVERY
        - AWARENESS
        - RESEARCH
      bittreesContext: >
        Research team coordination; ensures Bittrees discovery and awareness
        tasks are sourced, verified, assigned, and delivered on cadence.
      notSuitableFor:
        - direct code implementation
        - wallet or onchain execution
        - ops coordination outside research scope
      costTier: high
      status: available
    # Per-agent skills MERGE with the defaults above.
    skills:
      - team-coordinator
      - brain

  - name: web-researcher
    description: >-
      Source gatherer. Uses WebSearch/WebFetch to find authoritative, recent
      sources for an assigned sub-question, extracts the relevant facts, and
      returns concise notes with URLs and dates — sourced material, not analysis.

  - name: analyst
    description: >-
      Deep analysis. Compares and evaluates the gathered material, reasons about
      trade-offs and implications, surfaces patterns and gaps, and produces a
      structured assessment with explicit confidence levels and open questions.

  - name: fact-checker
    description: >-
      Verification. Independently checks the analyst's key claims against the
      cited sources, flags anything unsupported, outdated, or contradictory, and
      rates each claim (supported / weak / unsupported) so only what holds up
      makes it into the report.
    skills:
      - brain

  - name: writer
    description: >-
      Synthesizer. Turns the verified findings into a clear, structured report
      for the requester — summary, key findings, supporting detail, and a sources
      list with citations — written for the audience the lead specifies.
