# SkillMesh Agent Team — Full Roster
# Deploy with: /deploy skillmesh-team  (all 38 agents, one team)
#
# ── Agent cap ─────────────────────────────────────────────────────────────────
# MAX AGENTS: 69  — enforced by pre-sync check script:
#   node workspace/projects/skillmesh/agents/plugins/skillmesh/tools/check-agent-cap.mjs
# Do NOT add new agents without running this check first.
#
# ── Sub-team configs (deploy groups independently) ────────────────────────────
#   /deploy skillmesh-ops       → Marketplace ops, skill catalog, QA (7 agents)
#   /deploy skillmesh-research  → Market data, entity extraction, alerts (5 agents)
#   /deploy skillmesh-content   → Moderation, rewriting, formatting (5 agents)
#   /deploy skillmesh-protocol  → On-chain monitoring, incident reporting (5 agents)
#   /deploy skillmesh-chain     → Wallet, settlement, gas, tokenomics (4 agents)
#   /deploy skillmesh-health    → API, IPFS, deployment monitoring (3 agents)
#   /deploy skillmesh-growth    → Analytics, brokering, onboarding (3 agents)
# ─────────────────────────────────────────────────────────────────────────────
#
# Runtime options:
#   claude-code-cli  → Anthropic via Claude Code CLI login (no API key needed)
#   codex            → OpenAI (OPENAI_API_KEY required)
#   claude-agent-sdk → Anthropic via ANTHROPIC_API_KEY
#   ollama           → Local Ollama server (default: http://127.0.0.1:11434/v1, no API key)
#
# Prerequisites:
#   1. Add to your .env:
#        SKILLMESH_PRIVATE_KEY=0x...
#        SKILLMESH_APP_URL=https://skillmesh.bittrees.org
#   2. Register once (Sepolia ETH needed):
#        node workspace/projects/skillmesh/agents/plugins/skillmesh/tools/register.mjs
#   3. Deploy: /deploy skillmesh-team

version: "1"
team: skillmesh

defaults:
  local: true
  runtime: claude-code-cli
  model: claude-sonnet-5
  skills:
    - identity
    - inter-agent
    - catalog
    - brain
    - task-discipline
  plugins:
    - name: skillmesh
      path: ../workspace/projects/skillmesh/agents/plugins/skillmesh

agents:

  # ── Runtime fallback policy ────────────────────────────────────────────────
  # Primary runtimes: claude-code-cli (9 agents) | codex/gpt-5.3-codex (26 agents)
  # Fallback chain when an agent is unresponsive or returns no output within SLA:
  #   claude-code-cli → codex/gpt-5.3-codex → codex/gpt-5.4 (higher capacity)
  #   codex/gpt-5.3-codex → codex/gpt-5.4 → codex/gpt-5.5 (highest)
  # To switch a live agent: POST /remote {"command":"/model <agent> <model>"}
  # ops-team task-master auto-detects probe failures and can trigger /model switches.
  # ─────────────────────────────────────────────────────────────────────────

  # ── Team Lead ──────────────────────────────────────────────────────────────
  - name: skillmesh-ops-lead
    description: >
      SkillMesh operations team lead — coordinates the full agent roster across
      marketplace ops, research, content, and protocol monitoring. Assigns work,
      tracks blockers, and ensures agents and skills stay in sync with on-chain
      state. Orchestrates multi-agent workflows and escalates to the human operator.
      For non-trivial objectives, creates and claims its own lead task, creates
      member-owned child tasks for delegated work, dispatches independent child
      tasks in parallel, and includes delegated_task_names when marking the lead
      task done. Returns substantial accomplishment packets through default/coder
      and default/researcher validation before default/lead treats the work as final.
    skills:
      - team-coordinator
      - idagents-team-builder
    catalog:
      role: lead
      expertise:
        - orchestration
        - team-coordination
        - marketplace-ops
        - protocol-oversight
        - on-chain-sync
      costTier: high
      status: available

  # ── Marketplace Ops (source: skillmesh-ops.yaml) ───────────────────────────
  - name: marketplace-manager
    description: >
      Marketplace health — listings, pricing, demand analysis, and inventory
      optimization. Monitors provider activity, flags stale listings, and
      surfaces actionable improvements.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: manager
      expertise:
        - marketplace
        - pricing
        - inventory
        - demand-analysis
      costTier: high

  - name: skill-master
    description: >
      Skill catalog growth — discovery, generation, validation, and publishing.
      Proposes new skills based on demand signals and publishes them on-chain
      via publish-skills.mjs.
    catalog:
      role: developer
      expertise:
        - skill-design
        - ipfs
        - on-chain-publishing
        - catalog-growth
      costTier: medium

  - name: skill-tester
    description: >
      Skill quality assurance — test case execution, reliability scoring, and
      failure reporting. Runs skills against sample inputs and grades output
      against declared schemas.
    runtime: claude-code-cli
    model: claude-sonnet-5
    heartbeat: 43200
    dangerouslySkipPermissions: true
    catalog:
      role: qa
      expertise:
        - testing
        - reliability
        - schema-validation
        - failure-analysis
      costTier: medium

  - name: skill-rater
    description: >
      Skill ratings, creator reputation, security monitoring, and anomaly
      detection. Assigns quality tiers and flags suspicious token activity.
    runtime: claude-code-cli
    model: claude-sonnet-5
    heartbeat: 43200
    dangerouslySkipPermissions: true
    catalog:
      role: auditor
      expertise:
        - reputation
        - security
        - ratings
        - anomaly-detection
      costTier: medium

  # ── Research Stack (source: research-stack.yaml) ───────────────────────────
  - name: research-analyst
    description: >
      Research Stack lead — coordinates market parsing, entity extraction, summary
      formatting, and alert routing for analysts and crypto ops teams. Delegates
      to market-parser, alert-router, and summary tools. Returns substantial
      accomplishment packets through default/coder and default/researcher validation
      before default/lead treats the work as final.
    skills:
      - team-coordinator
    catalog:
      role: analyst
      expertise:
        - market-data
        - entity-extraction
        - summarization
        - alert-routing
      costTier: medium

  - name: market-parser
    description: >
      Parses raw market data, headlines, and price feeds into normalized JSON.
      Feeds structured output to entity-extractor and summary-formatter.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - market-data
        - parsing
        - normalization
      costTier: low

  - name: entity-extractor
    description: >
      Extracts named entities (addresses, tokens, protocols, people) from
      unstructured text. Returns typed arrays with confidence scores.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - entity-extraction
        - nlp
        - classification
      costTier: low

  - name: summary-formatter
    description: >
      Condenses long-form content into structured summaries at configurable
      depth levels, optimized for both human readers and agent consumption.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - summarization
        - content-processing
        - depth-control
      costTier: low

  - name: alert-router
    description: >
      Classifies signals by severity and routes them to webhook, A2A message,
      or structured log. Receives output from summary-formatter or anomaly-classifier.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - routing
        - notification
        - signal-classification
      costTier: low

  # ── Web Design + Content Ops (source: skillmesh-ops.yaml / content-ops.yaml) ─
  - name: web-design
    description: >
      React frontend design and UX review — audits UI quality, accessibility,
      and visual consistency across the SkillMesh web app.
    plugins:
      - name: skillmesh
        path: ../workspace/projects/skillmesh/agents/plugins/skillmesh
      - name: frontend-design
        path: ../plugins/claude-code/frontend-design
    catalog:
      role: designer
      expertise:
        - react
        - accessibility
        - ux-review
        - visual-design
      costTier: medium

  - name: content-ops
    description: >
      Content Ops Stack — moderates inbound content for safety and compliance,
      rewrites drafts for tone and clarity, generates structured metadata (title,
      tags, SEO signals), and formats output for distribution channels. Returns
      substantial accomplishment packets through default/coder and default/researcher
      validation before default/lead treats the work as final.
    skills:
      - team-coordinator
    catalog:
      role: content-lead
      expertise:
        - content-moderation
        - rewriting
        - metadata-generation
        - channel-formatting
      costTier: medium

  - name: content-moderator
    description: >
      Classifies inbound content for safety, compliance, and quality. Returns
      verdict with category labels and confidence scores. Gates rewrite-assistant.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - moderation
        - safety
        - classification
      costTier: low

  - name: channel-formatter
    description: >
      Transforms structured content into channel-specific formats: Markdown,
      HTML, plain text, or JSON feed. Last step in the content ops pipeline.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - formatting
        - markdown
        - distribution
      costTier: low

  # ── Protocol Monitor (source: protocol-monitor.yaml) ──────────────────────
  - name: protocol-monitor
    description: >
      Protocol Monitoring Stack lead — watches on-chain event streams, classifies
      anomalies against baselines, summarizes incidents with timeline and
      recommendations, and dispatches alerts to operator endpoints. Returns
      substantial accomplishment packets through default/coder and default/researcher
      validation before default/lead treats the work as final.
    runtime: ollama
    model: qwen3:4b
    skills:
      - team-coordinator
    catalog:
      role: monitor
      expertise:
        - on-chain-events
        - anomaly-detection
        - incident-reporting
        - alert-dispatch
      costTier: medium

  - name: event-watcher
    description: >
      Monitors on-chain event streams for specified contract addresses and event
      signatures. Emits structured payloads to anomaly-classifier on each match.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - blockchain
        - event-streaming
        - contract-monitoring
      costTier: low

  - name: anomaly-classifier
    description: >
      Classifies observed chain activity against baseline patterns. Flags
      anomalies by type, severity, and affected protocol components.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - anomaly-detection
        - classification
        - baseline-analysis
      costTier: low

  - name: incident-summarizer
    description: >
      Aggregates anomaly signals into a human-readable incident report with
      timeline, affected systems, root cause hypothesis, and recommended actions.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - incident-management
        - summarization
        - root-cause-analysis
      costTier: medium

  - name: notification-dispatcher
    description: >
      Dispatches incident reports and alerts to operator endpoints via webhook,
      A2A message, or structured log. Supports deduplication and rate limiting.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - notifications
        - webhook
        - a2a-messaging
        - deduplication
      costTier: low

  # ── Content Ops gap-fills (source: skillmesh-content.yaml) ────────────────
  - name: rewrite-assistant
    description: >
      Rewrites moderation-passed content for tone, clarity, and reading level.
      Accepts a draft and target register; returns polished copy ready for
      metadata-generator.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - rewriting
        - tone-control
        - readability
      costTier: low

  - name: metadata-generator
    description: >
      Generates structured metadata for content: title, summary, tags, keywords,
      and SEO signals. Output feeds channel-formatter in the content pipeline.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - metadata
        - seo
        - tagging
      costTier: low

  # ── Ops Expansion (source: skillmesh-ops.yaml) ─────────────────────────────
  - name: contract-auditor
    description: >
      Reviews smart contract interaction patterns in skill definitions and agent
      transactions before on-chain submission. Flags reentrancy risks, unsafe
      patterns, and permission mismatches.
    catalog:
      role: auditor
      expertise:
        - smart-contracts
        - security
        - reentrancy
        - permission-audit
      costTier: high

  # ── On-Chain Ops (source: skillmesh-chain.yaml) ────────────────────────────
  - name: wallet-guardian
    description: >
      Monitors ETH and AST balances across all registered agent addresses. Alerts
      when any wallet drops below threshold and generates a prioritized top-up list.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: monitor
      expertise:
        - wallet-monitoring
        - balance-alerts
        - gas-management
      costTier: low

  - name: settlement-watcher
    description: >
      Scans ComputeEscrow for stalled sessions where proposeSettlement has not been
      called. Identifies responsible agent and generates nudge messages.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: monitor
      expertise:
        - escrow
        - settlement
        - session-management
      costTier: low

  - name: gas-oracle
    description: >
      Monitors Sepolia gas prices and caches optimal transaction windows. Returns
      current gas price, recommended wait time, and a 24h forecast.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - gas-optimization
        - transaction-timing
        - cost-reduction
      costTier: low

  - name: token-economist
    description: >
      Tracks AST token velocity, circulating supply, staking patterns, and compute
      session economics. Returns demand signals and anomaly flags.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: analyst
      expertise:
        - tokenomics
        - demand-analysis
        - staking
        - compute-economics
      costTier: medium

  # ── Platform Health (source: skillmesh-health.yaml) ───────────────────────
  - name: api-monitor
    description: >
      Polls SkillMesh REST endpoints and tracks uptime, response latency, and error
      rates. Returns a health report with degraded endpoints and p95 latency.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: monitor
      expertise:
        - api-monitoring
        - uptime
        - latency
        - health-reporting
      costTier: low

  - name: ipfs-guardian
    description: >
      Verifies all published skill CIDs are accessible and pinned on Pinata. Re-pins
      cold CIDs and flags definition hash mismatches between on-chain and IPFS.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: monitor
      expertise:
        - ipfs
        - pinata
        - cid-verification
        - data-integrity
      costTier: low

  - name: deployment-watcher
    description: >
      Monitors Vercel deployment status for the SkillMesh web app. Reports build
      failures, environment variable drift, and failed serverless function invocations.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: monitor
      expertise:
        - vercel
        - deployment
        - build-monitoring
        - env-drift
      costTier: low

  # ── Growth & Analytics (source: skillmesh-growth.yaml) ────────────────────
  - name: growth-analyst
    description: >
      Tracks weekly marketplace KPIs: new skill listings, transaction volume, unique
      agent registrations, compute session counts, and AST flow. Returns week-on-week
      growth reports.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: analyst
      expertise:
        - growth-analytics
        - kpi-tracking
        - marketplace-metrics
        - reporting
      costTier: medium

  - name: skill-broker
    description: >
      Matches incoming skill execution requests to the best available provider based
      on price, quality score, and availability. Returns ordered provider recommendations.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: skill-executor
      expertise:
        - matchmaking
        - provider-routing
        - price-quality-tradeoff
      costTier: low

  - name: onboarding-guide
    description: >
      Walks new agents through the full SkillMesh onboarding flow: wallet funding check,
      registration, skill inventory setup, and first compute session. Responds to
      discovery:ping from unknown agents.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: guide
      expertise:
        - onboarding
        - agent-registration
        - discovery
        - first-session
      costTier: low

  # ── Chain Registrar (source: skillmesh-chain.yaml) ─────────────────────────
  - name: chain-registrar
    description: >
      Team provisioner — registers new agents on AgentRegistry, tops up ETH balances,
      distributes AST tokens, and verifies skill grants. Responds to provision:new-agent
      A2A requests. The single source of truth for agent on-chain provisioning state.
    catalog:
      role: registrar
      expertise:
        - on-chain-registration
        - eth-funding
        - ast-distribution
        - agent-provisioning
        - skill-grants
      costTier: low


  # ── ETH Ecosystem Agents ──────────────────────────────────────────────────

  - name: safe-guardian
    description: >
      Monitors Safe{Gnosis} multisig wallets — inspects configuration (owners,
      threshold, modules), tracks pending transactions awaiting signatures, and
      alerts when a transaction reaches threshold or stalls. Routes signature
      requests to the right owners and reports executed settlements to skillmesh-ops-lead.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: monitor
      expertise:
        - safe-multisig
        - gnosis-safe
        - multisig-operations
        - transaction-monitoring
      costTier: low

  - name: alchemy-agent
    description: >
      Alchemy-backed data agent — provides real-time ERC-20 token prices, 24-hour
      market data, and NFT metadata lookups via the Alchemy API. Answers token
      valuation queries from other agents and feeds the token-economist and
      market-parser pipelines. Requires ALCHEMY_API_KEY in environment.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: data-provider
      expertise:
        - token-prices
        - nft-metadata
        - alchemy-api
        - market-data
      costTier: low

  - name: chain-analyst
    description: >
      On-chain forensics — decodes EVM transaction calldata into human-readable
      function calls, queries The Graph subgraphs for protocol-level data, and
      cross-references event streams with anomaly signals. Used by contract-auditor
      and protocol-monitor for deep transaction analysis.
    runtime: ollama
    model: qwen3:4b
    catalog:
      role: analyst
      expertise:
        - calldata-decoding
        - the-graph
        - subgraph-querying
        - on-chain-forensics
      costTier: medium

  # ── Self-Improvement Loop ──────────────────────────────────────────────────
  - name: skill-discoverer
    description: >
      Autonomous self-improvement agent — runs on a 6-hour heartbeat to audit the
      SkillMesh catalog, identify coverage gaps, publish up to 3 new skills per cycle,
      create up to 2 new agents, and ensure all agent wallets hold sufficient ETH and
      AST. Uses the creator key to publish on-chain. Reports actions to skillmesh-ops-lead.
    heartbeat: 43200
    dangerouslySkipPermissions: true
    catalog:
      role: orchestrator
      expertise:
        - skill-discovery
        - skill-publishing
        - agent-factory
        - self-improvement
        - wallet-health
      costTier: high
