name: Security runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.4'
      - run: node --version
      - run: npm install
      - name: Record generated dependency lockfile for review
        run: |
          git -c color.ui=false diff --no-ext-diff -- package-lock.json
          sha256sum package-lock.json
      - run: npm run ci:preflight
