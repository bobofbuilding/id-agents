name: Security runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.4'
      - run: node --version
      - run: npm ci
      - run: npm exec --yes --package=npm@11.8.0 -- npm --version
      - run: npm exec --yes --package=npm@11.8.0 -- npm update @modelcontextprotocol/sdk vitest @vitest/mocker fast-uri hono ip-address proxy-addr source-map-js vite --package-lock-only --ignore-scripts
      - name: Record generated dependency lockfile for review
        if: always()
        run: |
          git -c color.ui=false diff --no-ext-diff -- package-lock.json
          sha256sum package-lock.json
      - run: npm ci
      - run: npm run ci:preflight
      - run: npm audit --audit-level=high
